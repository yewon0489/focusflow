<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f1115; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; transition: background-color 0.3s; }
    
    body.team-mode { background-color: #0d151c; }

    #login-screen { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
    #login-screen h1 { color: #4ade80; font-size: 32px; }
    #login-screen p { color: #94a3b8; margin-bottom: 20px; }
    .btn-google { background: #ffffff; color: #0f1115; font-weight: 600; padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; gap: 10px; }
    .btn-google:hover { background: #f1f5f9; }

    #main-dashboard { display: none; width: 100%; max-width: 1080px; padding: 24px; flex-direction: column; gap: 20px; align-self: flex-start; margin-top: 20px; }
    
    .header-banner { background: linear-gradient(135deg, #13271f 0%, #0d1a14 100%); border: 1px solid #1f3d2f; border-radius: 16px; padding: 20px 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; transition: all 0.3s; }
    body.team-mode .header-banner { background: linear-gradient(135deg, #111d2e 0%, #0a111b 100%); border-color: #1e3a5f; }

    .user-profile { display: flex; align-items: center; gap: 12px; }
    .user-profile img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #4ade80; }
    body.team-mode .user-profile img { border-color: #38bdf8; }
    
    .user-info-text h1 { font-size: 20px; color: #4ade80; }
    body.team-mode .user-info-text h1 { color: #38bdf8; }
    
    .btn-logout { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 4px; }
    
    .mode-toggle { display: flex; background: #0f1115; border-radius: 10px; padding: 4px; border: 1px solid #28323e; }
    .mode-btn { background: transparent; border: none; color: #94a3b8; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
    .mode-btn.active.personal { background: #4ade80; color: #0f1115; }
    .mode-btn.active.team { background: #38bdf8; color: #0f1115; }

    .clock-widget { background: #181d24; border: 1px solid #28323e; padding: 12px 20px; border-radius: 12px; text-align: right; }
    .clock-time { font-size: 24px; font-weight: 700; font-family: monospace; color: #f8fafc; letter-spacing: 2px; }
    
    .grid-layout { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 20px; }
    @media (max-width: 860px) { .grid-layout { grid-template-columns: 1fr; } }
    .card { background: #181d24; border: 1px solid #28323e; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
    
    .card-title { font-size: 16px; font-weight: 600; color: #4ade80; display: flex; align-items: center; gap: 8px; }
    body.team-mode .card-title { color: #38bdf8; }

    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #0f1115; border: 1px solid #2d3748; border-radius: 8px; padding: 10px 12px; color: #f8fafc; font-size: 14px; outline: none; }
    button.btn-add { background: #4ade80; color: #0f1115; border: none; border-radius: 8px; padding: 0 14px; font-weight: 600; cursor: pointer; }
    body.team-mode button.btn-add { background: #38bdf8; }
    
    .list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; }
    .list-item { display: flex; align-items: center; justify-content: space-between; background: #212832; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
    .list-item-content { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; }
    .list-item.completed span { text-decoration: line-through; color: #64748b; }
    .btn-delete { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 13px; }
    .habit-item { display: flex; justify-content: space-between; align-items: center; background: #212832; padding: 12px; border-radius: 8px; font-size: 14px; }
    .habit-item label { display: flex; align-items: center; gap: 10px; cursor: pointer; width: 100%; }
    
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: #4ade80; cursor: pointer; }
    body.team-mode input[type="checkbox"] { accent-color: #38bdf8; }

    textarea { background: #0f1115; border: 1px solid #2d3748; border-radius: 8px; padding: 12px; color: #f8fafc; font-size: 13px; resize: vertical; min-height: 140px; outline: none; }
    .sync-status { position: absolute; top: 20px; right: 20px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>

  <div id="login-screen">
    <h1>FocusFlow™</h1>
    <p>보안이 적용된 프라이빗 생산성 워크스페이스입니다.</p>
    <button class="btn-google" id="btn-login">
      <svg width="24" height="24" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.73 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Google 계정으로 로그인
    </button>
  </div>

  <div id="main-dashboard">
    <header class="header-banner">
      <div class="user-profile">
        <img id="user-photo" src="" alt="Profile">
        <div class="user-info-text">
          <h1 id="user-name">이름</h1>
          <button class="btn-logout" id="btn-logout">로그아웃</button>
        </div>
      </div>
      
      <div class="mode-toggle">
        <button class="mode-btn active personal" id="btn-mode-personal">👤 개인 공간</button>
        <button class="mode-btn team" id="btn-mode-team">🤝 팀 공유</button>
      </div>

      <div class="clock-widget">
        <div class="clock-time" id="realtime-clock">00:00:00</div>
      </div>
    </header>

    <div class="grid-layout">
      <section class="card">
        <h2 class="card-title" id="title-memo">📌 개인 메모장</h2>
        <span class="sync-status" id="memo-status"></span>
        <textarea id="memo-input" placeholder="여기에 작성된 내용은 모드에 따라 다르게 저장됩니다."></textarea>
      </section>

      <section class="card">
        <h2 class="card-title" id="title-tasks">✅ 오늘 할 일</h2>
        <div class="input-group">
          <input type="text" id="task-input" placeholder="새 할 일 입력 후 Enter" />
          <button class="btn-add" id="btn-add-task">추가</button>
        </div>
        <ul class="list" id="task-list"></ul>
      </section>

      <section class="card">
        <h2 class="card-title" id="title-habits">🌱 일일 루틴</h2>
        <div class="list" id="habit-list">
          <div class="habit-item"><label><input type="checkbox" id="habit-0" /><span id="label-habit-0">데일리 리서치</span></label></div>
          <div class="habit-item"><label><input type="checkbox" id="habit-1" /><span id="label-habit-1">운동 및 스트레칭</span></label></div>
          <div class="habit-item"><label><input type="checkbox" id="habit-2" /><span id="label-habit-2">물 2L 마시기</span></label></div>
          <div class="habit-item"><label><input type="checkbox" id="habit-3" /><span id="label-habit-3">하루 회고 작성</span></label></div>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, setDoc, query, orderBy } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    // 수정된 부분: signInWithPopup 대신 signInWithRedirect를 사용합니다.
    import { getAuth, signInWithRedirect, GoogleAuthProvider, signOut, onAuthStateChanged, getRedirectResult } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuTcliFNf8xknWzB1Y8w6AdSSfxop4_8M",
      authDomain: "focusflow-db-9b872.firebaseapp.com",
      projectId: "focusflow-db-9b872",
      storageBucket: "focusflow-db-9b872.firebasestorage.app",
      messagingSenderId: "125507292387",
      appId: "1:125507292387:web:a4ad3ed445bda83ff289d6",
      measurementId: "G-1BVJ54ESHM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUserUid = null;
    let currentMode = 'personal'; 
    
    const body = document.body;
    const btnModePersonal = document.getElementById('btn-mode-personal');
    const btnModeTeam = document.getElementById('btn-mode-team');
    const titleMemo = document.getElementById('title-memo');
    const titleTasks = document.getElementById('title-tasks');
    const titleHabits = document.getElementById('title-habits');
    
    setInterval(() => {
      const now = new Date();
      document.getElementById('realtime-clock').textContent = 
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    }, 1000);

    // 로그인 버튼 클릭 시 팝업 대신 전체 화면 넘김(Redirect)으로 실행
    document.getElementById('btn-login').addEventListener('click', () => {
      signInWithRedirect(auth, provider);
    });
    
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // 리다이렉트 후 에러 캐치용 (에러가 있으면 콘솔이나 알림으로 보여줌)
    getRedirectResult(auth).catch((error) => {
      alert("로그인 중 문제가 발생했습니다: " + error.message);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserUid = user.uid;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'flex';
        document.getElementById('user-name').textContent = `${user.displayName}님`;
        document.getElementById('user-photo').src = user.photoURL;
        
        switchMode('personal'); 
      } else {
        currentUserUid = null;
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('main-dashboard').style.display = 'none';
        cleanupListeners();
      }
    });

    btnModePersonal.addEventListener('click', () => switchMode('personal'));
    btnModeTeam.addEventListener('click', () => switchMode('team'));

    function switchMode(mode) {
      currentMode = mode;
      if (mode === 'personal') {
        body.classList.remove('team-mode');
        btnModePersonal.classList.add('active');
        btnModeTeam.classList.remove('active');
        titleMemo.textContent = '📌 개인 메모장';
        titleTasks.textContent = '✅ 나의 할 일';
        titleHabits.textContent = '🌱 나의 일일 루틴';
      } else {
        body.classList.add('team-mode');
        btnModePersonal.classList.remove('active');
        btnModeTeam.classList.add('active');
        titleMemo.textContent = '📢 팀 공지 및 회의록';
        titleTasks.textContent = '🚀 팀 프로젝트 마일스톤';
        titleHabits.textContent = '📊 팀 공동 체크리스트';
      }
      loadDataForCurrentMode();
    }

    let unsubscribeTasks, unsubscribeMemo, unsubscribeHabits;
    const taskInput = document.getElementById('task-input');
    const memoInput = document.getElementById('memo-input');
    
    const getDbPath = (collectionName) => {
      return currentMode === 'personal' 
        ? collection(db, "users", currentUserUid, collectionName)
        : collection(db, "team_workspace", "main_room", collectionName); 
    };
    const getDocPath = (docName) => {
      return currentMode === 'personal'
        ? doc(db, "users", currentUserUid, docName)
        : doc(db, "team_workspace", "main_room", docName);
    };

    function cleanupListeners() {
      if(unsubscribeTasks) unsubscribeTasks();
      if(unsubscribeMemo) unsubscribeMemo();
      if(unsubscribeHabits) unsubscribeHabits();
    }

    let isEventListenersAttached = false;
    let memoTimeout;

    function attachGlobalListeners() {
      if (isEventListenersAttached) return;
      isEventListenersAttached = true;

      document.getElementById('btn-add-task').onclick = () => {
        if (!taskInput.value.trim()) return;
        addDoc(getDbPath("tasks"), { text: taskInput.value.trim(), completed: false, createdAt: Date.now() });
        taskInput.value = '';
      };

      const memoStatus = document.getElementById('memo-status');
      memoInput.addEventListener('input', () => {
        memoStatus.textContent = '저장 중...';
        clearTimeout(memoTimeout);
        memoTimeout = setTimeout(() => {
          setDoc(getDocPath("memo"), { content: memoInput.value }, { merge: true });
          memoStatus.textContent = '저장됨';
          setTimeout(() => memoStatus.textContent = '', 2000);
        }, 800);
      });
      
      for (let i = 0; i < 4; i++) {
        const cb = document.getElementById(`habit-${i}`);
        cb.addEventListener('change', () => setDoc(getDocPath("habits"), { [`habit_${i}`]: cb.checked }, { merge: true }));
      }
    }

    function loadDataForCurrentMode() {
      cleanupListeners();
      attachGlobalListeners();

      const taskListEl = document.getElementById('task-list');
      taskInput.value = ''; 
      
      unsubscribeTasks = onSnapshot(query(getDbPath("tasks"), orderBy("createdAt", "asc")), (snapshot) => {
        taskListEl.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const task = docSnap.data();
          const li = document.createElement('li');
          li.className = `list-item ${task.completed ? 'completed' : ''}`;
          
          const content = document.createElement('div');
          content.className = 'list-item-content';
          
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.onclick = (e) => {
            e.stopPropagation();
            updateDoc(doc(getDbPath("tasks").firestore, getDbPath("tasks").path, docSnap.id), { completed: !task.completed });
          };
          
          const text = document.createElement('span');
          text.textContent = task.text;
          
          content.appendChild(checkbox);
          content.appendChild(text);
          
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'btn-delete';
          deleteBtn.textContent = '삭제';
          deleteBtn.onclick = () => deleteDoc(doc(getDbPath("tasks").firestore, getDbPath("tasks").path, docSnap.id));
          
          li.appendChild(content);
          li.appendChild(deleteBtn);
          taskListEl.appendChild(li);
        });
      });

      memoInput.value = '';
      unsubscribeMemo = onSnapshot(getDocPath("memo"), (docSnap) => {
        if (docSnap.exists() && document.activeElement !== memoInput) {
          memoInput.value = docSnap.data().content || '';
        }
      });

      for(let i=0; i<4; i++) document.getElementById(`habit-${i}`).checked = false;
      unsubscribeHabits = onSnapshot(getDocPath("habits"), (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          for (let i = 0; i < 4; i++) {
            const cb = document.getElementById(`habit-${i}`);
            if (cb) cb.checked = data[`habit_${i}`] || false;
          }
        }
      });
    }
  </script>
</body>
</html>
