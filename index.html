<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow Dashboard</title>
  <style>
    /* 기본 UI 및 레이아웃 */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f1115; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; transition: background-color 0.3s; }
    body.team-mode { background-color: #0b1118; }
    #login-screen { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
    #login-screen h1 { color: #4ade80; font-size: 32px; }
    #login-screen p { color: #94a3b8; margin-bottom: 20px; }
    .btn-google { background: #ffffff; color: #0f1115; font-weight: 600; padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; gap: 10px; }
    #main-dashboard { display: none; width: 100%; max-width: 1200px; padding: 24px; flex-direction: column; gap: 20px; align-self: flex-start; margin-top: 20px; }
    .header-banner { background: linear-gradient(135deg, #13271f 0%, #0d1a14 100%); border: 1px solid #1f3d2f; border-radius: 16px; padding: 20px 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; transition: all 0.3s; }
    body.team-mode .header-banner { background: linear-gradient(135deg, #111d2e 0%, #0a111b 100%); border-color: #1e3a5f; }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .user-profile img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #4ade80; }
    body.team-mode .user-profile img { border-color: #38bdf8; }
    .user-info-text h1 { font-size: 20px; color: #4ade80; }
    body.team-mode .user-info-text h1 { color: #38bdf8; }
    .btn-logout { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 4px; }
    .mode-toggle { display: flex; background: #0f1115; border-radius: 10px; padding: 4px; border: 1px solid #28323e; }
    .mode-btn { background: transparent; border: none; color: #94a3b8; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
    .mode-btn.active.personal { background: #4ade80; color: #0f1115; }
    .mode-btn.active.team { background: #38bdf8; color: #0f1115; }
    .clock-widget { background: #181d24; border: 1px solid #28323e; padding: 12px 20px; border-radius: 12px; text-align: right; }
    .clock-time { font-size: 24px; font-weight: 700; font-family: monospace; color: #f8fafc; letter-spacing: 2px; }
    
    /* 그리드 및 카드 */
    .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; }
    .card { background: #181d24; border: 1px solid #28323e; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; }
    .card-full { grid-column: 1 / -1; }
    .card-title { font-size: 16px; font-weight: 600; color: #4ade80; display: flex; align-items: center; gap: 8px; }
    body.team-mode .card-title { color: #38bdf8; }
    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #0f1115; border: 1px solid #2d3748; border-radius: 8px; padding: 10px 12px; color: #f8fafc; font-size: 14px; outline: none; }
    button.btn-action { background: #4ade80; color: #0f1115; border: none; border-radius: 8px; padding: 0 14px; font-weight: 600; cursor: pointer; }
    body.team-mode button.btn-action { background: #38bdf8; }
    .list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
    .list-item { display: flex; align-items: center; justify-content: space-between; background: #212832; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
    .list-item-content { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; }
    .list-item.completed span { text-decoration: line-through; color: #64748b; }
    .btn-delete { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 13px; padding: 4px; }
    textarea { background: #0f1115; border: 1px solid #2d3748; border-radius: 8px; padding: 12px; color: #f8fafc; font-size: 13px; resize: vertical; min-height: 140px; outline: none; }
    
    /* 목표 대시보드 */
    .goals-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 860px) { .goals-grid { grid-template-columns: 1fr 1fr; } .grid-layout { grid-template-columns: 1fr; } }
    .goal-box { background: #0f1115; border: 1px solid #2d3748; border-radius: 12px; padding: 16px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
    .goal-box:hover { border-color: #4ade80; transform: translateY(-2px); }
    .goal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .goal-title { color: #f8fafc; font-weight: 600; font-size: 15px; }
    .goal-percent { color: #4ade80; font-size: 18px; font-weight: bold; font-family: monospace; }
    .progress-bar { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #4ade80; width: 0%; transition: width 0.5s ease-out; }
    
    /* 모달 팝업 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-content { background: #181d24; border: 1px solid #2d3748; border-radius: 16px; width: 90%; max-width: 600px; padding: 24px; display: flex; flex-direction: column; gap: 16px; position: relative; }
    .btn-close-modal { position: absolute; top: 16px; right: 16px; background: transparent; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
    .btn-close-modal:hover { color: #ef4444; }
    .modal-content h2 { color: #4ade80; font-size: 20px; }
    .goal-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .goal-table th, .goal-table td { padding: 12px; text-align: left; border-bottom: 1px solid #2d3748; font-size: 14px; }
    .goal-table th { color: #94a3b8; font-weight: 500; }
    .goal-table td { color: #e2e8f0; }
    .table-check { width: 40px; text-align: center; }
    .table-action { width: 60px; text-align: center; }

    /* 구글 캘린더 컨테이너 */
    .calendar-container { width: 100%; height: 400px; border-radius: 8px; overflow: hidden; border: 1px solid #2d3748; background: #0f1115; }

    /* 팀 로비 및 방 화면 */
    #team-lobby { display: none; flex-direction: column; align-items: center; justify-content: center; background: #181d24; border: 1px solid #28323e; border-radius: 14px; padding: 40px 20px; text-align: center; gap: 24px; }
    #team-lobby h2 { color: #38bdf8; }
    .lobby-box { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; background: #0f1115; padding: 20px; border-radius: 12px; border: 1px solid #2d3748; }
    .divider { width: 100%; height: 1px; background: #2d3748; margin: 10px 0; }
    .room-list-container { width: 100%; max-width: 340px; background: #0f1115; border-radius: 12px; border: 1px solid #2d3748; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .room-list-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 8px; cursor: pointer; border: 1px solid #334155; }
    .room-list-item:hover { border-color: #38bdf8; background: #2d3748; }
    
    #team-room-view { display: none; flex-direction: column; gap: 20px; width: 100%; }
    .room-header { display: flex; justify-content: space-between; background: #1e293b; padding: 12px 20px; border-radius: 12px; border: 1px solid #334155; }
    .room-code-badge { background: #0f1115; padding: 4px 12px; border-radius: 6px; font-family: monospace; color: #38bdf8; font-weight: bold; }
    .pixel-canvas { width: 100%; height: 360px; border-radius: 14px; position: relative; overflow: hidden; transition: all 0.5s ease; background: #0f1115; border: 2px solid #2d3748; background-image: radial-gradient(#2d3748 1px, transparent 1px); background-size: 20px 20px; }
    .zone { position: absolute; border: 2px dashed #475569; border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; color: #64748b; font-size: 14px; font-weight: bold; background: rgba(30, 41, 59, 0.4); }
    .zone-work { top: 10%; left: 8%; width: 35%; height: 45%; } .zone-meeting { top: 10%; right: 8%; width: 45%; height: 50%; } .zone-rest { bottom: 8%; left: 30%; width: 40%; height: 30%; }
  </style>
</head>
<body>

  <div id="login-screen">
    <h1>FocusFlow™</h1>
    <p>보안이 적용된 프라이빗 생산성 워크스페이스입니다.</p>
    <button class="btn-google" id="btn-login">Google 계정으로 로그인</button>
  </div>

  <div id="main-dashboard">
    <header class="header-banner">
      <div class="user-profile">
        <img id="user-photo" src="" alt="Profile">
        <div class="user-info-text"><h1 id="user-name">이름</h1><button class="btn-logout" id="btn-logout">로그아웃</button></div>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active personal" id="btn-mode-personal">👤 개인 공간</button>
        <button class="mode-btn team" id="btn-mode-team">🤝 팀 공유</button>
      </div>
      <div class="clock-widget"><div class="clock-time" id="realtime-clock">00:00:00</div></div>
    </header>

    <div class="grid-layout" id="personal-view">
      
      <section class="card card-full">
        <h2 class="card-title">🎯 나의 목표 달성 현황</h2>
        <div class="goals-grid">
          <div class="goal-box" data-type="daily">
            <div class="goal-header"><span class="goal-title">일일 목표</span><span class="goal-percent" id="pct-daily">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="bar-daily"></div></div>
          </div>
          <div class="goal-box" data-type="weekly">
            <div class="goal-header"><span class="goal-title">주간 목표</span><span class="goal-percent" id="pct-weekly">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="bar-weekly"></div></div>
          </div>
          <div class="goal-box" data-type="monthly">
            <div class="goal-header"><span class="goal-title">월간 목표</span><span class="goal-percent" id="pct-monthly">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="bar-monthly"></div></div>
          </div>
          <div class="goal-box" data-type="yearly">
            <div class="goal-header"><span class="goal-title">올해 목표</span><span class="goal-percent" id="pct-yearly">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="bar-yearly"></div></div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">📅 나의 캘린더</h2>
        <div class="calendar-container">
          <!-- 💡 달력 iframe에 id를 부여하여 로그인 시 주소를 동적으로 바꿉니다 -->
          <iframe id="my-dynamic-calendar" style="border: 0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">✅ 오늘 할 일 & 메모</h2>
        <div class="input-group"><input type="text" id="personal-task-input" placeholder="새 할 일 추가"/><button class="btn-action" id="btn-add-personal-task">추가</button></div>
        <ul class="list" id="personal-task-list"></ul>
        <textarea id="personal-memo-input" placeholder="간단한 메모장입니다." style="margin-top: 10px;"></textarea>
      </section>
    </div>

    <!-- 목표 모달 -->
    <div class="modal-overlay" id="goal-modal">
      <div class="modal-content">
        <button class="btn-close-modal" id="btn-close-modal">&times;</button>
        <h2 id="modal-title">일일 목표 상세</h2>
        <div class="input-group" style="margin-bottom: 8px;">
          <input type="text" id="modal-goal-input" placeholder="새로운 목표를 등록하세요" />
          <button class="btn-action" id="btn-add-modal-goal">추가</button>
        </div>
        <table class="goal-table">
          <thead><tr><th class="table-check">달성</th><th>목표 내용</th><th class="table-action">관리</th></tr></thead>
          <tbody id="modal-goal-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- 팀 화면은 생략없이 그대로 유지 -->
    <div id="team-lobby">
      <h2>🏢 팀 워크스페이스 로비</h2>
      <div class="lobby-box">
        <input type="text" id="invite-code-input" placeholder="초대 코드 입력" maxlength="6" style="text-transform: uppercase;"/>
        <button class="btn-action" id="btn-join-room" style="padding: 12px; margin-bottom: 10px;">입장하기</button>
        <button class="btn-action" id="btn-create-room" style="padding: 12px; background: transparent; border: 1px solid #38bdf8; color: #38bdf8;">+ 방 생성하기</button>
      </div>
      <div class="room-list-container" id="my-room-list" style="display: none;">
        <h3>내 워크스페이스 목록</h3><div id="joined-rooms-wrapper"></div>
      </div>
    </div>

    <div id="team-room-view">
      <div class="room-header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="color: #94a3b8;">방 이름:</span><span class="room-code-badge" id="current-room-code-display"></span>
        </div>
        <button class="btn-logout" id="btn-leave-room">나가기</button>
      </div>
      <div class="pixel-canvas" id="canvas-area">
        <div class="zone zone-work">🖥️ 업무 존</div><div class="zone zone-meeting">🤝 회의실</div><div class="zone zone-rest">🛋️ 휴게실</div>
      </div>
      <div style="display:flex; justify-content:center; gap: 10px; margin-top: -10px;">
        <button class="btn-action" data-status="work" style="padding: 8px 16px;">💻 업무</button>
        <button class="btn-action" data-status="meeting" style="padding: 8px 16px;">🗣️ 회의</button>
        <button class="btn-action" data-status="rest" style="padding: 8px 16px;">☕ 휴식</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, setDoc, query, orderBy, getDoc } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuTcliFNf8xknWzB1Y8w6AdSSfxop4_8M",
      authDomain: "focusflow-db-9b872.firebaseapp.com",
      projectId: "focusflow-db-9b872",
      storageBucket: "focusflow-db-9b872.firebasestorage.app",
      messagingSenderId: "125507292387",
      appId: "1:125507292387:web:a4ad3ed445bda83ff289d6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let allGoalsData = { daily: [], weekly: [], monthly: [], yearly: [] };
    let currentModalType = null;

    setInterval(() => { const now = new Date(); document.getElementById('realtime-clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`; }, 1000);
    
    document.getElementById('btn-login').addEventListener('click', () => signInWithPopup(auth, provider));
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'flex';
        document.getElementById('user-name').textContent = `${user.displayName}님`;
        document.getElementById('user-photo').src = user.photoURL;
        
        // 💡 핵심 로직: 로그인한 유저의 이메일을 기반으로 달력 주소를 조합해서 밀어넣습니다!
        const userEmailForCal = encodeURIComponent(user.email);
        const dynamicCalUrl = `https://calendar.google.com/calendar/embed?src=${userEmailForCal}&ctz=Asia%2FSeoul&bgcolor=%230f1115&color=%234ade80&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=1&showCalendars=0&showTz=0&mode=MONTH`;
        document.getElementById('my-dynamic-calendar').src = dynamicCalUrl;

        switchMode('personal'); 
      } else {
        currentUser = null;
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('main-dashboard').style.display = 'none';
      }
    });

    document.getElementById('btn-mode-personal').addEventListener('click', () => switchMode('personal'));
    document.getElementById('btn-mode-team').addEventListener('click', () => switchMode('team'));

    function switchMode(mode) {
      if (mode === 'personal') {
        document.body.classList.remove('team-mode');
        document.getElementById('btn-mode-personal').classList.add('active');
        document.getElementById('btn-mode-team').classList.remove('active');
        document.getElementById('personal-view').style.display = 'grid';
        document.getElementById('team-lobby').style.display = 'none';
        document.getElementById('team-room-view').style.display = 'none';
        loadPersonalData();
      } else {
        document.body.classList.add('team-mode');
        document.getElementById('btn-mode-personal').classList.remove('active');
        document.getElementById('btn-mode-team').classList.add('active');
        document.getElementById('personal-view').style.display = 'none';
        document.getElementById('team-lobby').style.display = 'flex';
      }
    }

    let unsubGoals;
    function loadPersonalData() {
      const userRef = doc(db, "users", currentUser.uid);
      
      // 메모장 (기존 기능)
      const pMemo = document.getElementById('personal-memo-input');
      onSnapshot(doc(userRef, "data", "memo"), s => { if (s.exists() && document.activeElement !== pMemo) pMemo.value = s.data().content || ''; });
      pMemo.oninput = () => { setTimeout(() => setDoc(doc(userRef, "data", "memo"), { content: pMemo.value }, { merge: true }), 800); };

      if(unsubGoals) unsubGoals();
      unsubGoals = onSnapshot(query(collection(userRef, "goals"), orderBy("createdAt", "asc")), (snapshot) => {
        allGoalsData = { daily: [], weekly: [], monthly: [], yearly: [] };
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          if(allGoalsData[data.type]) allGoalsData[data.type].push({ id: docSnap.id, ...data });
        });

        ['daily', 'weekly', 'monthly', 'yearly'].forEach(type => {
          const goals = allGoalsData[type];
          const total = goals.length;
          const completed = goals.filter(g => g.completed).length;
          const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
          
          document.getElementById(`pct-${type}`).textContent = `${percent}%`;
          document.getElementById(`bar-${type}`).style.width = `${percent}%`;
        });
        if (currentModalType) renderModalTable(currentModalType);
      });
    }

    const typeNames = { daily: '일일 목표', weekly: '주간 목표', monthly: '월간 목표', yearly: '올해 목표' };
    document.querySelectorAll('.goal-box').forEach(box => {
      box.addEventListener('click', () => {
        currentModalType = box.dataset.type;
        document.getElementById('modal-title').textContent = `${typeNames[currentModalType]} 상세 내역`;
        document.getElementById('goal-modal').style.display = 'flex';
        renderModalTable(currentModalType);
      });
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      document.getElementById('goal-modal').style.display = 'none';
      currentModalType = null;
    });

    function renderModalTable(type) {
      const tbody = document.getElementById('modal-goal-tbody');
      tbody.innerHTML = '';
      const goals = allGoalsData[type] || [];
      if (goals.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#64748b; padding:20px;">아직 등록된 목표가 없습니다.</td></tr>`;
        return;
      }
      goals.forEach(goal => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="table-check"><input type="checkbox" style="width:18px; height:18px;" ${goal.completed ? 'checked' : ''}></td>
          <td style="${goal.completed ? 'text-decoration: line-through; color: #64748b;' : ''}">${goal.text}</td>
          <td class="table-action"><button class="btn-delete" style="font-size: 16px;" title="삭제">🗑️</button></td>
        `;
        tr.querySelector('input').addEventListener('change', () => updateDoc(doc(db, "users", currentUser.uid, "goals", goal.id), { completed: !goal.completed }));
        tr.querySelector('.btn-delete').addEventListener('click', () => deleteDoc(doc(db, "users", currentUser.uid, "goals", goal.id)));
        tbody.appendChild(tr);
      });
    }

    document.getElementById('btn-add-modal-goal').addEventListener('click', () => {
      const input = document.getElementById('modal-goal-input');
      if(input.value.trim() && currentModalType) {
        addDoc(collection(db, "users", currentUser.uid, "goals"), { type: currentModalType, text: input.value.trim(), completed: false, createdAt: Date.now() });
        input.value = '';
      }
    });

    // 엔터키 입력 지원
    document.getElementById('modal-goal-input').addEventListener('keypress', (e) => {
      if(e.key === 'Enter') document.getElementById('btn-add-modal-goal').click();
    });
  </script>
</body>
</html>
